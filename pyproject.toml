[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-prototype"
version = "0.1.0"
description = "A local-first competitor intelligence RAG prototype with deterministic financial analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pypdf>=6.0,<7",
    "cryptography>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["enterprise_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
